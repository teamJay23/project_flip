<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flip — 카드 만들기</title>
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  /* 색상 변수 (기존 Flip 프로토타입과 같은 값) / Color tokens (same as Flip prototype) */
  :root{
    --bg-1:#221630;
    --bg-2:#3a2255;
    --paper:#faf6ef;
    --ink:#2a2138;
    --ink-soft:#6b6178;
    --amber:#f2b84b;
    --line:#ffffff1c;
    --dim:#000000a6; /* 실패 안내 뒤 어두운 배경 / Backdrop behind failure notice */
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Pretendard', -apple-system, sans-serif;
    background:radial-gradient(circle at 30% 20%, var(--bg-2), var(--bg-1) 70%);
    -webkit-tap-highlight-color: transparent;
  }

  /* 화면 전체: 휴대폰 높이에 맞추고 iOS 안전 영역 피하기 / Full screen with iOS safe areas */
  .screen{
    height:100dvh;
    width:100%; max-width:480px; margin:0 auto;
    display:flex; flex-direction:column; gap:14px;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  }

  .title{
    margin:0;
    color:var(--paper);
    font-size:22px; font-weight:700;
  }
  .desc{
    margin:0;
    color:var(--paper); opacity:.7;
    font-size:14px; line-height:1.5;
  }

  /* 입력창: 남은 높이를 채우고, 긴 글은 창 안에서 스크롤 / Fill remaining height, scroll inside */
  .input{
    flex:1;
    width:100%;
    padding:16px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--paper); color:var(--ink);
    font-family:inherit;
    font-size:16px; /* 16px 미만이면 iOS가 화면을 확대함 / iOS zooms below 16px */
    line-height:1.6;
    resize:none;
    overflow-y:auto;
  }
  .input::placeholder{ color:var(--ink-soft); }

  /* [카드 만들기] 버튼 / Submit button */
  .submit{
    width:100%;
    padding:16px;
    border:0; border-radius:14px;
    background:var(--amber); color:var(--ink);
    font-family:inherit; font-size:17px; font-weight:700;
    cursor:pointer;
  }
  .submit:active{ transform:scale(.98); }

  /* 빈 입력 안내 문구 / Empty input hint */
  .hint{
    margin:0;
    color:var(--amber);
    font-size:14px; font-weight:600;
  }

  /* 입력 화면 고지 문구 (02 계획 3-4번 후보 A) / Data notice on input screen */
  .data-notice{
    margin:0;
    color:var(--paper); opacity:.85;
    font-size:13px; line-height:1.5;
  }

  /* B. 로딩 화면 / Loading screen */
  .loading-screen{
    justify-content:center; align-items:center;
  }
  /* hidden이면 확실히 숨기기 (display:flex보다 우선) / Force hide over display:flex */
  .screen[hidden]{ display:none; }
  .loading-text{
    margin:0;
    color:var(--paper);
    font-size:18px; font-weight:600;
  }
  /* 돌아가는 원 / Spinner */
  .loading-spinner{
    width:44px; height:44px;
    border:4px solid var(--line);
    border-top-color:var(--amber);
    border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-spinner[hidden]{ display:none; }
  /* 움직임 줄이기 설정이면 회전 멈춤 / Stop spinning for reduced-motion users */
  @media (prefers-reduced-motion: reduce){
    .loading-spinner{ animation:none; }
  }

  /* 실패 안내: 입력 화면 위에 겹쳐 뜸 / Failure notice layered over input screen */
  .fail-layer{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    background:var(--dim);
  }
  .fail-layer[hidden]{ display:none; }
  .fail-box{
    width:100%; max-width:400px;
    padding:24px 20px 20px;
    border-radius:18px;
    background:var(--paper);
    display:flex; flex-direction:column; gap:20px;
  }
  .fail-text{
    margin:0;
    color:var(--ink);
    font-size:16px; font-weight:600; line-height:1.5;
  }
</style>
</head>
<body>
  <!-- A. 입력 화면 / Input screen -->
  <main class="screen" id="inputScreen">
    <h1 class="title">카드 만들기</h1>
    <p class="desc">학습할 텍스트를 붙여넣으면 카드로 만들어 드려요.</p>

    <textarea class="input" id="sourceInput"
      placeholder="여기에 학습할 텍스트를 붙여넣어 주세요"></textarea>

    <!-- 빈 입력일 때만 보임 / Shown only on empty input -->
    <p class="hint" id="emptyHint" hidden>학습할 텍스트를 붙여넣어 주세요</p>

    <!-- 고지 문구 (PRD 반영 전 임시, 문구는 팀 질문 18에서 확정) / Data notice (temporary until PRD update) -->
    <p class="data-notice" id="dataNotice">입력한 글은 Google AI로 전송되며, Google 검토자가 읽거나 Google의 AI 개선에 쓰일 수 있어요. 회사 자료·개인정보는 넣지 마세요.</p>

    <button class="submit" id="submitBtn" type="button">카드 만들기</button>
  </main>

  <!-- B. 로딩 화면: 사용자는 기다리기만 함 (PRD 기능 6) / Loading screen, user only waits -->
  <main class="screen loading-screen" id="loadingScreen" hidden>
    <div class="loading-spinner" id="loadingSpinner" aria-hidden="true"></div>
    <p class="loading-text" id="loadingText">카드를 만들고 있어요</p>
  </main>

  <!-- 실패 안내 (PRD 기능 7, 문구 3종) / Failure notice (3 fixed messages) -->
  <div class="fail-layer" id="failLayer" role="alertdialog" aria-modal="true" aria-labelledby="failText" hidden>
    <div class="fail-box">
      <p class="fail-text" id="failText"></p>
      <button class="submit" id="failOkBtn" type="button">확인</button>
    </div>
  </div>

<script>
  const sourceInput = document.getElementById('sourceInput');
  const emptyHint = document.getElementById('emptyHint');
  const submitBtn = document.getElementById('submitBtn');
  const inputScreen = document.getElementById('inputScreen');
  const loadingScreen = document.getElementById('loadingScreen');
  const loadingText = document.getElementById('loadingText');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const failLayer = document.getElementById('failLayer');
  const failText = document.getElementById('failText');
  const failOkBtn = document.getElementById('failOkBtn');

  // 이미 시작했는지 기억 (두 번 누름 막기) / Remember if already started (block double tap)
  let isStarted = false;

  // 길이 규칙 (PRD v1.5 기능 3) / Length rules
  const MIN_CHARS = 10;
  const MAX_CHARS = 5000;
  const MIN_WORDS = 5;
  const MAX_WORDS = 2000;

  // 안내 문구 / Hint messages
  const MSG_EMPTY = '학습할 텍스트를 붙여넣어 주세요';
  const MSG_TOO_SHORT = '조금 더 긴 글을 넣어주세요 (한글 10자 / 영어 5단어 이상)';

  // 실패 안내 문구 3종 (PRD 기능 7, 글자 그대로) / Fixed failure messages
  const MSG_FAIL = {
    source: '카드를 만들지 못했습니다. 원문을 확인한 후 다시 시도해주세요',
    network: '인터넷 연결을 확인한 뒤 다시 시도해주세요',
    service: '잠시 후 다시 시도해주세요'
  };

  // 띄어쓰기·줄바꿈만 있으면 빈 입력 / Whitespace-only counts as empty
  function isEmpty(text){
    return text.trim() === '';
  }

  // 주가 되는 언어가 한글인지 단어 다수결로 판단 / Decide main language by word majority
  // - 한글이 든 단어 = 한글 단어 / Word with Hangul = Korean word
  // - 한글 없이 알파벳이 든 단어 = 영어 단어 / Word with Latin letters only = English word
  // - 숫자·기호만 있는 단어는 세지 않음 / Numbers/symbols only are ignored
  // - 동점이면 한글 / Tie goes to Korean
  function isKoreanMain(words){
    let korean = 0;
    let english = 0;
    for (const word of words) {
      if (/[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(word)) korean++;
      else if (/[A-Za-z]/.test(word)) english++;
    }
    return korean > 0 && korean >= english;
  }

  // 한글이 주이면 글자 수, 아니면 단어 수로 셈
  // Count characters if Korean is main, otherwise count words
  function measure(text){
    const words = text.trim().split(/\s+/);
    if (isKoreanMain(words)) {
      // 띄어쓰기·줄바꿈 제외 글자 수 / Characters without whitespace
      return { unit: 'chars', count: Array.from(text.replace(/\s/g, '')).length };
    }
    // 띄어쓰기 기준 단어 수 / Words split by whitespace
    return { unit: 'words', count: words.length };
  }

  // 규칙을 벗어나면 안내 문구, 통과하면 빈 문자열 / Return hint message or '' if OK
  function checkLength(text){
    if (isEmpty(text)) return MSG_EMPTY;

    const { unit, count } = measure(text);
    const shown = count.toLocaleString('ko-KR'); // 5001 → 5,001

    if (unit === 'chars') {
      if (count < MIN_CHARS) return MSG_TOO_SHORT;
      if (count > MAX_CHARS) return `5,000자까지 만들 수 있어요 (지금 ${shown}자)`;
    } else {
      if (count < MIN_WORDS) return MSG_TOO_SHORT;
      if (count > MAX_WORDS) return `2,000단어까지 만들 수 있어요 (지금 ${shown}단어)`;
    }
    return '';
  }

  // [카드 만들기] 누르기 / Submit click
  submitBtn.addEventListener('click', async () => {
    // 두 번째 누름은 무시 / Ignore second tap
    if (isStarted) return;

    // 빈 입력·길이 규칙 막기 (버튼은 잠그지 않고 원문도 그대로) / Block invalid input (keep button and text)
    const message = checkLength(sourceInput.value);
    if (message) {
      emptyHint.textContent = message;
      emptyHint.hidden = false;
      return;
    }

    // 시작 표시 + 버튼 잠그기 / Mark started + lock button
    isStarted = true;
    submitBtn.disabled = true;

    // 로딩 화면 → 카드 요청 → 결과 처리 / Loading → request → handle result
    showScreen('loading');
    const result = await requestCards(sourceInput.value);
    handleResult(result);
  });

  // 다시 입력하면 안내 숨기기 / Hide hint when user types again
  sourceInput.addEventListener('input', () => {
    emptyHint.hidden = true;
  });

  // 화면 하나만 보이기 ('input' / 'loading') / Show only one screen
  function showScreen(name){
    inputScreen.hidden = name !== 'input';
    loadingScreen.hidden = name !== 'loading';
  }

  // 다시 [카드 만들기]를 누를 수 있게 / Allow submitting again
  function resetStart(){
    isStarted = false;
    submitBtn.disabled = false;
  }

  // 실패 안내 보이기 (입력창 원문은 그대로) / Show failure notice, keep source text
  function showFail(kind){
    failText.textContent = MSG_FAIL[kind];
    showScreen('input');
    failLayer.hidden = false;
    resetStart();
    failOkBtn.focus();
  }

  // [확인]: 안내만 닫기 (키보드가 올라오지 않게 버튼에 포커스) / Close notice only
  failOkBtn.addEventListener('click', () => {
    failLayer.hidden = true;
    submitBtn.focus();
  });

  // 결과 처리: 성공이면 임시 표시, 아니면 실패 안내 / Handle result
  function handleResult(result){
    if (result.kind === 'ok') {
      // 학습 화면은 3단계에서 만든다 (임시 표시) / Study screen comes in stage 3 (temporary)
      loadingText.textContent = `카드 ${result.cards.length}장 받음 (임시)`;
      loadingSpinner.hidden = true; // 다 됐으니 원 숨기기 (S2-4에서 정리) / Hide spinner when done
      return;
    }
    showFail(result.kind);
  }

  // 카드 요청: { kind: 'ok', cards } 또는 { kind: 'source' / 'network' / 'service' }
  // Request cards: returns { kind: 'ok', cards } or a failure kind
  async function requestCards(text){
    // [FAKE-S2-1] 시작: 가짜 결과 (S2-4에서 진짜 요청으로 바꾸며 지움) / Fake results (remove in S2-4)
    // 주소 끝 ?fake=ok|slow|fail-source|fail-network|fail-service / Pick result by URL parameter
    const fake = new URLSearchParams(location.search).get('fake') || 'ok';
    const wait = fake === 'slow' ? 8000 : 2000;
    await new Promise((resolve) => setTimeout(resolve, wait));
    if (fake === 'fail-source') return { kind: 'source' };
    if (fake === 'fail-network') return { kind: 'network' };
    if (fake === 'fail-service') return { kind: 'service' };
    return { kind: 'ok', cards: [
      { front: '가짜 질문 1', back: '가짜 답 1' },
      { front: '가짜 질문 2', back: '가짜 답 2' },
      { front: '가짜 질문 3', back: '가짜 답 3' }
    ] };
    // [FAKE-S2-1] 끝 / End
  }
</script>
</body>
</html>
