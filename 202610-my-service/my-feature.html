<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flip — 카드 만들기</title>
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  /* 색상 변수 (기존 Flip 프로토타입과 같은 값) / Color tokens (same as Flip prototype) */
  :root{
    --bg-1:#221630;
    --bg-2:#3a2255;
    --paper:#faf6ef;
    --ink:#2a2138;
    --ink-soft:#6b6178;
    --amber:#f2b84b;
    --line:#ffffff1c;
    --dim:#000000a6; /* 실패 안내 뒤 어두운 배경 / Backdrop behind failure notice */
    --back:#2a1b42; /* 카드 뒷면 바탕 (옛 프로토타입 값) / Card back (prototype value) */
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Pretendard', -apple-system, sans-serif;
    background:radial-gradient(circle at 30% 20%, var(--bg-2), var(--bg-1) 70%);
    -webkit-tap-highlight-color: transparent;
  }
  /* 학습 화면에서는 아래로 당겨 새로고침 막기 (새로고침하면 카드가 사라짐, 30 계획 6절 A)
     Block pull-to-refresh on the study screen (a reload loses all cards) */
  html.no-pull, html.no-pull body{ overscroll-behavior-y:none; }

  /* 화면 전체: 휴대폰 높이에 맞추고 iOS 안전 영역 피하기 / Full screen with iOS safe areas */
  .screen{
    height:100dvh;
    width:100%; max-width:480px; margin:0 auto;
    display:flex; flex-direction:column; gap:14px;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  }

  .title{
    margin:0;
    color:var(--paper);
    font-size:22px; font-weight:700;
  }
  .desc{
    margin:0;
    color:var(--paper); opacity:.7;
    font-size:14px; line-height:1.5;
  }

  /* 입력 화면: 글자를 크게 해서 내용이 화면보다 길면 화면 안에서 스크롤 (30 계획 6절 B)
     Input screen scrolls when large text makes the content taller than the screen */
  .input-screen{ overflow-y:auto; }

  /* 입력창: 남은 높이를 채우고, 긴 글은 창 안에서 스크롤 / Fill remaining height, scroll inside */
  .input{
    flex:1;
    /* 최소 5줄 (5줄 × 1.6em + 위아래 여백 32px + 테두리 2px). 글자를 키우면 같이 커짐
       At least 5 lines (5 × 1.6em + 32px padding + 2px border); grows with font size */
    min-height:calc(8em + 34px);
    width:100%;
    padding:16px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--paper); color:var(--ink);
    font-family:inherit;
    font-size:16px; /* 16px 미만이면 iOS가 화면을 확대함 / iOS zooms below 16px */
    line-height:1.6;
    resize:none;
    overflow-y:auto;
  }
  .input::placeholder{ color:var(--ink-soft); }

  /* [카드 만들기] 버튼 / Submit button */
  .submit{
    width:100%;
    padding:16px;
    border:0; border-radius:14px;
    background:var(--amber); color:var(--ink);
    font-family:inherit; font-size:17px; font-weight:700;
    cursor:pointer;
  }
  .submit:active{ transform:scale(.98); }

  /* 빈 입력 안내 문구 / Empty input hint */
  .hint{
    margin:0;
    color:var(--amber);
    font-size:14px; font-weight:600;
  }

  /* 입력 화면 고지 문구 (02 계획 3-4번 후보 A) / Data notice on input screen */
  .data-notice{
    margin:0;
    color:var(--paper); opacity:.85;
    font-size:13px; line-height:1.5;
  }

  /* B. 로딩 화면 / Loading screen */
  .loading-screen{
    justify-content:center; align-items:center;
  }
  /* hidden이면 확실히 숨기기 (display:flex보다 우선) / Force hide over display:flex */
  .screen[hidden]{ display:none; }
  .loading-text{
    margin:0;
    color:var(--paper);
    font-size:18px; font-weight:600;
    text-align:center;
    overflow-wrap:anywhere; /* 띄어쓰기 없는 긴 글도 줄바꿈 / Wrap long unbroken text */
  }
  /* 돌아가는 원 / Spinner */
  .loading-spinner{
    width:44px; height:44px;
    border:4px solid var(--line);
    border-top-color:var(--amber);
    border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-spinner[hidden]{ display:none; }
  /* C. 학습 화면: 카드 한 장 / Study screen, one card */
  /* 카드: 남은 높이를 채움. min-height:0이 없으면 긴 글에 카드가 늘어나 스크롤이 안 됨 (30 계획 1절 7번)
     Card fills remaining height. Without min-height:0 it grows with long text and never scrolls */
  .card{
    flex:1; min-height:0;
    position:relative;
    border-radius:18px;
    transform-style:preserve-3d;
    transform:perspective(1200px) rotateY(0deg);
    transition:transform .4s ease;
    cursor:pointer;
    touch-action:manipulation; /* 두 번 탭 확대 막기 / Block double-tap zoom */
    outline:none;
  }
  .card.flipped{ transform:perspective(1200px) rotateY(180deg); }
  .card:focus-visible{ outline:3px solid var(--amber); outline-offset:3px; }

  /* 앞면·뒷면: 겹쳐 두고, 긴 글은 면 안에서 스크롤 (잘라서 숨기지 않음)
     Front/back stacked; long text scrolls inside the face (never clipped) */
  .face{
    position:absolute; inset:0; min-height:0;
    display:flex; flex-direction:column; gap:12px;
    padding:20px;
    border-radius:18px;
    overflow-y:auto;
    overscroll-behavior:contain; /* 면 끝까지 밀어도 화면으로 번지지 않음 / Don't chain scroll to the page */
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    transition:visibility 0s linear 0s; /* 보일 때는 바로 / Show immediately */
  }
  .face-front{ background:var(--paper); color:var(--ink); }
  .face-back{ background:var(--back); color:var(--amber); transform:rotateY(180deg); }
  /* 안 보이는 면: 손가락 입력을 받지 않고, 회전이 끝난 뒤 숨김 (30 계획 S3-2 5번)
     Hidden face: no touch input, hidden after the turn ends */
  .card.flipped .face-front,
  .card:not(.flipped) .face-back{
    visibility:hidden;
    pointer-events:none;
    transition:visibility 0s linear .4s;
  }
  .face-label{
    margin:0;
    font-size:13px; font-weight:600;
  }
  .face-front .face-label{ color:var(--ink-soft); }
  .face-back .face-label{ opacity:.8; }
  /* margin:auto로 가운데. 글이 넘치면 위가 잘리지 않고 맨 위부터 스크롤
     Centered with auto margins; when overflowing, scrolls from the top without clipping */
  .face-text{
    margin:auto 0;
    font-size:18px; font-weight:600; line-height:1.6;
    text-align:left;
    overflow-wrap:anywhere; /* 긴 영어 단어도 줄바꿈 / Wrap long words */
  }
  /* 안다/모른다 버튼 자리 (버튼은 4단계, 결정 2 ②) / Button row placeholder (buttons in stage 4) */
  .judge-row{ flex:none; height:52px; }

  /* 움직임 줄이기 설정이면 회전 멈춤 / Stop spinning for reduced-motion users */
  @media (prefers-reduced-motion: reduce){
    .loading-spinner{ animation:none; }
    /* 카드도 돌지 않고 바로 바뀜 / Card switches instantly without turning */
    .card,
    .card.flipped .face-front,
    .card:not(.flipped) .face-back{ transition:none; }
  }

  /* 실패 안내: 입력 화면 위에 겹쳐 뜸 / Failure notice layered over input screen */
  .fail-layer{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    background:var(--dim);
  }
  .fail-layer[hidden]{ display:none; }
  .fail-box{
    width:100%; max-width:400px;
    padding:24px 20px 20px;
    border-radius:18px;
    background:var(--paper);
    display:flex; flex-direction:column; gap:20px;
  }
  .fail-text{
    margin:0;
    color:var(--ink);
    font-size:16px; font-weight:600; line-height:1.5;
  }
</style>
</head>
<body>
  <!-- A. 입력 화면 / Input screen -->
  <main class="screen input-screen" id="inputScreen">
    <h1 class="title">카드 만들기</h1>
    <p class="desc">학습할 텍스트를 붙여넣으면 카드로 만들어 드려요.</p>

    <textarea class="input" id="sourceInput"
      placeholder="여기에 학습할 텍스트를 붙여넣어 주세요"></textarea>

    <!-- 빈 입력일 때만 보임 / Shown only on empty input -->
    <p class="hint" id="emptyHint" hidden>학습할 텍스트를 붙여넣어 주세요</p>

    <!-- 고지 문구 (PRD 반영 전 임시, 문구는 팀 질문 18에서 확정) / Data notice (temporary until PRD update) -->
    <p class="data-notice" id="dataNotice">입력한 글은 Google AI로 전송되며, Google 검토자가 읽거나 Google의 AI 개선에 쓰일 수 있어요. 회사 자료·개인정보는 넣지 마세요. 만 18세 이상만 사용할 수 있어요.</p>

    <button class="submit" id="submitBtn" type="button">카드 만들기</button>
  </main>

  <!-- B. 로딩 화면: 사용자는 기다리기만 함 (PRD 기능 6) / Loading screen, user only waits -->
  <main class="screen loading-screen" id="loadingScreen" hidden>
    <div class="loading-spinner" id="loadingSpinner" aria-hidden="true"></div>
    <p class="loading-text" id="loadingText">카드를 만들고 있어요</p>
  </main>

  <!-- C. 학습 화면: 카드를 탭하면 뒤집기만 (PRD 기능 9·10) / Study screen, tap only flips -->
  <main class="screen study-screen" id="studyScreen" hidden>
    <div class="card" id="card" role="button" tabindex="0">
      <div class="face face-front" id="frontFace">
        <p class="face-label">질문</p>
        <p class="face-text" id="frontText"></p>
      </div>
      <div class="face face-back" id="backFace" aria-hidden="true">
        <p class="face-label">답</p>
        <p class="face-text" id="backText"></p>
      </div>
    </div>
    <!-- 안다/모른다 버튼 자리 (4단계) / Button row placeholder (stage 4) -->
    <div class="judge-row" aria-hidden="true"></div>
  </main>

  <!-- 실패 안내 (PRD 기능 7, 문구 3종) / Failure notice (3 fixed messages) -->
  <div class="fail-layer" id="failLayer" role="alertdialog" aria-modal="true" aria-labelledby="failText" hidden>
    <div class="fail-box">
      <p class="fail-text" id="failText"></p>
      <button class="submit" id="failOkBtn" type="button">확인</button>
    </div>
  </div>

<!-- 카드 생성 웹 앱 주소 (window.APP_CONFIG.CARD_API_URL) / Card API URL -->
<script src="config.js"></script>
<script>
  const sourceInput = document.getElementById('sourceInput');
  const emptyHint = document.getElementById('emptyHint');
  const submitBtn = document.getElementById('submitBtn');
  const inputScreen = document.getElementById('inputScreen');
  const loadingScreen = document.getElementById('loadingScreen');
  const failLayer = document.getElementById('failLayer');
  const failText = document.getElementById('failText');
  const failOkBtn = document.getElementById('failOkBtn');
  const studyScreen = document.getElementById('studyScreen');
  const cardEl = document.getElementById('card');
  const frontFace = document.getElementById('frontFace');
  const backFace = document.getElementById('backFace');
  const frontText = document.getElementById('frontText');
  const backText = document.getElementById('backText');

  // 이미 시작했는지 기억 (두 번 누름 막기) / Remember if already started (block double tap)
  let isStarted = false;

  // 진행 중인 카드 요청 { controller, startedAt, timer } (없으면 null) / Request in progress
  let pending = null;

  // 학습 상태 (메모리에만, 새로고침하면 사라짐 — 4-3은 "이후" 단계)
  // Study state, memory only (lost on refresh; 4-3 comes later)
  let stack = [];        // 카드 목록 / Cards
  let current = 0;       // 지금 카드 번호 (0부터) / Current card index
  let isFlipped = false; // 뒷면을 보고 있는지 / Showing the back

  // 길이 규칙 (PRD v1.5 기능 3) / Length rules
  const MIN_CHARS = 10;
  const MAX_CHARS = 5000;
  const MIN_WORDS = 5;
  const MAX_WORDS = 2000;

  // 카드 장수·문장 수 규칙 (PRD v1.5 기능 5) / Card count and sentence rules
  const MAX_CARDS = 20;
  const MAX_SENTENCES = 3;

  // 카드를 기다리는 최대 시간 (PRD 6-c). Apps Script 50초보다 길게 둔다
  // Max wait for cards. Keep longer than Apps Script's 50s
  const LOAD_TIMEOUT_MS = 60000;

  // 이만큼 넘게 움직이면 탭이 아니라 밀기 (30 계획 결정 7) / Movement beyond this is a scroll, not a tap
  const TAP_MOVE_PX = 10;

  // 안내 문구 / Hint messages
  const MSG_EMPTY = '학습할 텍스트를 붙여넣어 주세요';
  const MSG_TOO_SHORT = '조금 더 긴 글을 넣어주세요 (한글 10자 / 영어 5단어 이상)';

  // 실패 안내 문구 3종 (PRD 기능 7, 글자 그대로) / Fixed failure messages
  const MSG_FAIL = {
    source: '카드를 만들지 못했습니다. 원문을 확인한 후 다시 시도해주세요',
    network: '인터넷 연결을 확인한 뒤 다시 시도해주세요',
    service: '잠시 후 다시 시도해주세요'
  };

  // 띄어쓰기·줄바꿈만 있으면 빈 입력 / Whitespace-only counts as empty
  function isEmpty(text){
    return text.trim() === '';
  }

  // 주가 되는 언어가 한글인지 단어 다수결로 판단 / Decide main language by word majority
  // - 한글이 든 단어 = 한글 단어 / Word with Hangul = Korean word
  // - 한글 없이 알파벳이 든 단어 = 영어 단어 / Word with Latin letters only = English word
  // - 숫자·기호만 있는 단어는 세지 않음 / Numbers/symbols only are ignored
  // - 동점이면 한글 / Tie goes to Korean
  function isKoreanMain(words){
    let korean = 0;
    let english = 0;
    for (const word of words) {
      if (/[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(word)) korean++;
      else if (/[A-Za-z]/.test(word)) english++;
    }
    return korean > 0 && korean >= english;
  }

  // 한글이 주이면 글자 수, 아니면 단어 수로 셈
  // Count characters if Korean is main, otherwise count words
  function measure(text){
    const words = text.trim().split(/\s+/);
    if (isKoreanMain(words)) {
      // 띄어쓰기·줄바꿈 제외 글자 수 / Characters without whitespace
      return { unit: 'chars', count: Array.from(text.replace(/\s/g, '')).length };
    }
    // 띄어쓰기 기준 단어 수 / Words split by whitespace
    return { unit: 'words', count: words.length };
  }

  // 규칙을 벗어나면 안내 문구, 통과하면 빈 문자열 / Return hint message or '' if OK
  function checkLength(text){
    if (isEmpty(text)) return MSG_EMPTY;

    const { unit, count } = measure(text);
    const shown = count.toLocaleString('ko-KR'); // 5001 → 5,001

    if (unit === 'chars') {
      if (count < MIN_CHARS) return MSG_TOO_SHORT;
      if (count > MAX_CHARS) return `5,000자까지 만들 수 있어요 (지금 ${shown}자)`;
    } else {
      if (count < MIN_WORDS) return MSG_TOO_SHORT;
      if (count > MAX_WORDS) return `2,000단어까지 만들 수 있어요 (지금 ${shown}단어)`;
    }
    return '';
  }

  // . ? ! 。 기준 문장 세기 (팀 질문 8: 단순 규칙) / Count sentences (simple rule)
  // 알려진 한계: "1.5배", "Mr. Kim"은 더 많게 셈 (16번 계획 1-3) / Known limit: decimals, abbreviations
  function countSentences(text){
    return text.split(/[.?!。]+/).filter((s) => s.trim() !== '').length;
  }

  // 한 면이 문자열이고 비어 있지 않은지 (숫자에 trim을 부르지 않게 typeof 먼저)
  // Face is a non-empty string (check typeof before trim)
  function isGoodFace(face){
    return typeof face === 'string' && !isEmpty(face);
  }

  // 같은 질문(앞뒤 띄어쓰기 뺀 앞면)은 처음 것만 남김, 안내 없음 (PRD 4-2, 결정 1·6)
  // 앞면이 글자가 아닌 카드는 남겨서 형식 검사가 잡게 한다
  // Keep only the first card of each question; leave bad fronts for the format check
  function dedupeFronts(cards){
    const seen = new Set();
    return cards.filter((card) => {
      if (!card || !isGoodFace(card.front)) return true;
      const key = card.front.trim();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  // AI 카드 검사: 배열 → 0장 → 같은 질문 거르기 → 앞 20장 자르기 → 전체 형식 → 전체 문장 수
  // Check AI cards: array → zero → drop duplicate questions → keep first 20 → all formats → all sentence counts
  // 돌려주는 값 / Returns: { kind: 'ok', cards } | { kind: 'source' } | { kind: 'service' }
  function checkCards(cards){
    // 목록이 아니면 서비스 문제 / Not a list → service problem
    if (!Array.isArray(cards)) {
      console.warn('[Flip] NOT_ARRAY');
      return { kind: 'service' };
    }
    // 0장이면 원문 문제 (4-a) / Zero cards → source problem
    if (cards.length === 0) return { kind: 'source' };

    // 같은 질문을 거른 뒤 생성 순서대로 앞 20장만, 안내 없음 (4-2, 5-b, 결정 6 B)
    // Drop duplicate questions, then keep first 20 in order, no notice
    const kept = dedupeFronts(cards).slice(0, MAX_CARDS);

    // 형식을 먼저 전부 본다: 빈 면·문자열 아님 → 서비스 문제 (팀 질문 7)
    // Check all formats first: empty or non-string face → service problem
    for (let i = 0; i < kept.length; i++) {
      const card = kept[i];
      if (!card || !isGoodFace(card.front) || !isGoodFace(card.back)) {
        console.warn('[Flip] BAD_CARD', i + 1); // 카드 번호만, 내용은 남기지 않음 / Card number only
        return { kind: 'service' };
      }
    }

    // 그다음 문장 수: 한 면이라도 3문장 초과 → 서비스 문제 (5-a)
    // 원문이 아니라 AI가 규칙을 어긴 것이라 다시 누르면 된다 (admin 2026-10-31, 강사님 피드백 5)
    // Then sentences: any face over 3 → service problem (AI broke the rule, retry helps)
    for (let i = 0; i < kept.length; i++) {
      if (countSentences(kept[i].front) > MAX_SENTENCES || countSentences(kept[i].back) > MAX_SENTENCES) {
        console.warn('[Flip] TOO_LONG', i + 1); // 카드 번호만 / Card number only
        return { kind: 'service' };
      }
    }
    return { kind: 'ok', cards: kept };
  }

  // [카드 만들기] 누르기 / Submit click
  submitBtn.addEventListener('click', async () => {
    // 두 번째 누름은 무시 / Ignore second tap
    if (isStarted) return;

    // 빈 입력·길이 규칙 막기 (버튼은 잠그지 않고 원문도 그대로) / Block invalid input (keep button and text)
    const message = checkLength(sourceInput.value);
    if (message) {
      emptyHint.textContent = message;
      emptyHint.hidden = false;
      return;
    }

    // 시작 표시 + 버튼 잠그기 / Mark started + lock button
    isStarted = true;
    submitBtn.disabled = true;

    // 로딩 화면 → 카드 요청 → 결과 처리 / Loading → request → handle result
    showScreen('loading');
    try {
      const result = await requestCards(sourceInput.value);
      handleResult(result);
    } catch (err) {
      // 예상 못 한 오류도 로딩에 갇히지 않게 / Never stay stuck on loading
      console.warn('[Flip] UNEXPECTED');
      showFail('service');
    }
  });

  // 다른 앱에 갔다 오면 지난 시간으로 60초를 다시 판단 (02 6-2번, S2-7)
  // 휴대폰은 화면 뒤에서 타이머를 늦추거나 멈추기 때문 / Phones delay or freeze timers in the background
  // Re-check the 60s limit by wall-clock time when the page is visible again
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !pending) return;
    const c = pending.controller; // 이 요청만 끊기 (다음 요청은 건드리지 않음) / Abort only this request
    const left = LOAD_TIMEOUT_MS - (Date.now() - pending.startedAt);
    clearTimeout(pending.timer);
    if (left <= 0) c.abort(); // 60초 지남 → 아래 TIMEOUT 길 / Over 60s → TIMEOUT path below
    else pending.timer = setTimeout(() => c.abort(), left); // 남은 시간만 다시 / Re-arm with time left
  });

  // 다시 입력하면 안내 숨기기 / Hide hint when user types again
  sourceInput.addEventListener('input', () => {
    emptyHint.hidden = true;
  });

  // 화면 하나만 보이기 ('input' / 'loading' / 'study') / Show only one screen
  function showScreen(name){
    inputScreen.hidden = name !== 'input';
    loadingScreen.hidden = name !== 'loading';
    studyScreen.hidden = name !== 'study';
    // 학습 화면일 때만 당겨서 새로고침 막기 / Block pull-to-refresh only on the study screen
    document.documentElement.classList.toggle('no-pull', name === 'study');
  }

  // 다시 [카드 만들기]를 누를 수 있게 / Allow submitting again
  function resetStart(){
    isStarted = false;
    submitBtn.disabled = false;
  }

  // 실패 안내 보이기 (입력창 원문은 그대로) / Show failure notice, keep source text
  function showFail(kind){
    failText.textContent = MSG_FAIL[kind];
    showScreen('input');
    failLayer.hidden = false;
    resetStart();
    failOkBtn.focus();
  }

  // [확인]: 안내만 닫기 (키보드가 올라오지 않게 버튼에 포커스) / Close notice only
  failOkBtn.addEventListener('click', () => {
    failLayer.hidden = true;
    submitBtn.focus();
  });

  // 결과 처리: 성공이면 학습 시작, 아니면 실패 안내 / Handle result
  function handleResult(result){
    // 성공이면 카드 검사를 거친다 / Run card check on success
    const checked = result.kind === 'ok' ? checkCards(result.cards) : result;
    if (checked.kind === 'ok') {
      startStudy(checked.cards);
      return;
    }
    showFail(checked.kind);
  }

  // 학습 시작: 추가 조작 없이 첫 카드 앞면 (PRD 4-1, 5-1) / Start study on first card's front
  function startStudy(cards){
    stack = cards;
    showCard(0);
    showScreen('study');
    cardEl.focus(); // 화면이 보인 뒤에 포커스 / Focus after the screen is shown
  }

  // 카드 하나 보이기, 언제나 앞면·맨 위부터 (5-1, 4단계 5-2 준비)
  // Show a card, always front side and scrolled to top
  function showCard(i){
    current = i;
    // AI 글은 글자로만 넣는다 (태그가 실행되지 않게) / Insert AI text as plain text only
    frontText.textContent = stack[i].front;
    backText.textContent = stack[i].back;
    frontFace.scrollTop = 0;
    backFace.scrollTop = 0;
    setFlipped(false);
  }

  // 앞/뒤 바꾸기만, 다음 카드로 가지 않음 (PRD 6-2)
  // 손가락 입력·숨기기는 CSS가 .flipped를 보고 처리 / CSS handles touch and visibility via .flipped
  // Flip only, never move to the next card
  function setFlipped(flipped){
    isFlipped = flipped;
    cardEl.classList.toggle('flipped', flipped);
    frontFace.setAttribute('aria-hidden', String(flipped));
    backFace.setAttribute('aria-hidden', String(!flipped));
  }

  // 손가락(마우스)을 댄 곳과 그때 보이는 면의 스크롤 위치 (결정 7) / Where the press began
  let tapStart = null;
  cardEl.addEventListener('pointerdown', (e) => {
    const face = isFlipped ? backFace : frontFace;
    tapStart = { x: e.clientX, y: e.clientY, scroll: face.scrollTop };
  });
  // 브라우저가 밀기로 보고 취소하면 기억 지우기 / Forget the press when the browser cancels it as a scroll
  cardEl.addEventListener('pointercancel', () => { tapStart = null; });

  // 카드 탭: 뒤집기 (뒷면에서 다시 탭하면 앞면, 결정 3) / Tap card: toggle front/back
  // 10px 넘게 움직였거나 면이 스크롤됐으면 탭이 아니라 밀기 → 뒤집지 않음 (결정 7)
  // Moved over 10px or the face scrolled → it was a scroll, not a tap
  cardEl.addEventListener('click', (e) => {
    const start = tapStart;
    tapStart = null;
    const face = isFlipped ? backFace : frontFace;
    if (start && (Math.abs(e.clientX - start.x) > TAP_MOVE_PX ||
                  Math.abs(e.clientY - start.y) > TAP_MOVE_PX ||
                  face.scrollTop !== start.scroll)) return;
    setFlipped(!isFlipped);
  });

  // 키보드 Enter·Space로도 뒤집기 / Flip with Enter or Space too
  cardEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault(); // Space로 화면이 스크롤되지 않게 / Stop Space from scrolling the page
      setFlipped(!isFlipped);
    }
  });

  // 카드 요청: { kind: 'ok', cards } 또는 { kind: 'source' / 'network' / 'service' }
  // Request cards: returns { kind: 'ok', cards } or a failure kind
  // 실패 나누기는 02 계획 6-1번 표 0~5 / Failure split follows plan 02, table 6-1 rows 0-5
  async function requestCards(text){
    // 0. 보내기 전에 인터넷이 꺼져 있으면 보내지 않음 / Offline: don't send
    if (!navigator.onLine) return { kind: 'network' };

    const url = window.APP_CONFIG && window.APP_CONFIG.CARD_API_URL;
    if (!url) {
      console.warn('[Flip] NO_URL'); // config.js를 못 읽음 / config.js missing
      return { kind: 'service' };
    }

    // 1. 60초가 지나면 요청을 끊음 (시작 시각도 기억, S2-7) / Abort after 60s, remember start time
    const controller = new AbortController();
    pending = {
      controller,
      startedAt: Date.now(),
      timer: setTimeout(() => controller.abort(), LOAD_TIMEOUT_MS)
    };
    let res = null;
    try {
      // text/plain: 브라우저 사전 요청(CORS preflight)을 피함 (22 7번) / Avoids CORS preflight
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ text }),
        signal: controller.signal
      });
      const data = await res.json();
      // 4. Apps Script가 실패라고 알려 줌 → 서비스 문제 / Server said not ok
      if (!data || data.ok !== true) {
        console.warn('[Flip]', data && data.reason, data && data.status);
        return { kind: 'service' };
      }
      // 5~9. 목록인지·장수·형식·문장 수는 checkCards가 본다 / checkCards does the rest
      return { kind: 'ok', cards: data.cards };
    } catch (err) {
      // 1. 60초 초과 / Timed out
      if (controller.signal.aborted) {
        console.warn('[Flip] TIMEOUT');
        return { kind: 'service' };
      }
      // 2. 응답을 못 받음: 인터넷이 꺼졌을 때만 인터넷 문구 / No response: network only if offline
      if (!res) {
        console.warn('[Flip] FETCH_FAILED');
        return { kind: navigator.onLine ? 'service' : 'network' };
      }
      // 3. 응답이 JSON이 아님 (예: Apps Script 오류 페이지) / Response not JSON
      console.warn('[Flip] BAD_JSON', res.status);
      return { kind: 'service' };
    } finally {
      // 먼저 끝나면 타이머 끄기 (다시 건 타이머 포함) / Stop timer once done, including a re-armed one
      clearTimeout(pending.timer);
      pending = null;
    }
  }
</script>
</body>
</html>
