<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flip — 5초 복습</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg-1:#221630;
    --bg-2:#3a2255;
    --paper:#faf6ef;
    --ink:#2a2138;
    --ink-soft:#6b6178;
    --back:#2a1b42;
    --amber:#f2b84b;
    --amber-soft:#f2b84b99;
    --know:#9cb380;
    --review:#e36b6b;
    --line:#ffffff1c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Pretendard', -apple-system, sans-serif;
    background:radial-gradient(circle at 30% 20%, var(--bg-2), var(--bg-1) 70%);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .screen{
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    position:relative;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
    overflow:hidden;
  }

  .header{
    width:100%;
    max-width:430px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:4px 2px 0;
    text-align:left;
  }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  .menu-toggle{
    width:38px; height:38px; border:1px solid #ffffff2b; border-radius:12px;
    background:#ffffff0d; color:#fff; font-size:19px; line-height:1; cursor:pointer;
  }
  .menu-toggle:active{ background:#ffffff1c; }
  .brand-wrap{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .brand{ font-size:clamp(15px, 4.4vw, 18px); font-weight:800; color:#fff; letter-spacing:-0.02em; white-space:nowrap; }
  .brand-subtitle{ font-size:clamp(9px, 2.8vw, 11px); color:#ffffff70; font-weight:500; line-height:1.3; max-width:clamp(150px, 48vw, 250px); }
  .progress-wrap{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:0 0 auto; }
  .progress{ font-size:12px; color:#fff; font-weight:700; }
  .progress-label{ font-size:10px; color:#ffffff5c; text-transform:uppercase; letter-spacing:0.08em; }
  .review-count{ position:absolute; top:62px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--review); opacity:0.9; white-space:nowrap; }

  .session-bar{
    width:100%; max-width:430px;
    display:flex; justify-content:space-between; align-items:center;
    margin-top:clamp(28px, 7vh, 58px);
    color:#ffffff6e; font-size:11px;
  }
  .session-bar::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 4px #f2b84b20; }
  .session-label{ margin-right:auto; margin-left:9px; }
  .session-time{ color:#ffffffa0; font-weight:700; }
  .generate-open{
    border:1px solid #f2b84b66; border-radius:999px; background:#f2b84b18;
    color:var(--amber); padding:7px 11px; font:inherit; font-size:11px; font-weight:700;
    cursor:pointer;
  }
  .generate-open:active{ background:#f2b84b30; }

  .menu-layer{
    position:fixed; inset:0; z-index:8; background:#120b1a66;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .menu-layer.show{ opacity:1; pointer-events:auto; }
  .app-menu{
    position:absolute; top:calc(62px + env(safe-area-inset-top)); right:12px;
    width:min(270px, calc(100vw - 24px)); padding:10px;
    border:1px solid var(--line); border-radius:18px; background:#302044;
    box-shadow:0 18px 50px #120b1acc; transform:translateY(-8px); transition:transform .2s ease;
  }
  .menu-layer.show .app-menu{ transform:translateY(0); }
  .menu-heading{ padding:8px 10px 10px; color:#ffffff66; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .menu-item{ display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px; padding:12px 10px; border:0; border-radius:10px; background:transparent; color:#fff; font:inherit; font-size:13px; text-align:left; cursor:pointer; }
  .menu-item:hover,.menu-item:active{ background:#ffffff12; }
  .menu-item span{ color:#ffffff4d; font-size:11px; }
  .menu-item-primary{ color:var(--amber); }
  .menu-notice{ min-height:16px; padding:5px 10px 2px; color:#ffffff70; font-size:11px; line-height:1.4; }

  /* 최하단 크레딧 */
  .footer{
    margin-top:auto;
    padding-top:14px;
    font-size:11px;
    color:#ffffff50;
    font-weight:500;
  }

  /* 카드 + 좌우 이전/다음 버튼을 한 줄에 */
  .stage-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(6px, 3vw, 18px);
    width:100%;
    max-width:480px;
    margin-top:clamp(16px, 3vh, 28px);
  }
  .side-btn{
    flex:0 0 auto;
    width:clamp(34px, 11vw, 42px); height:clamp(34px, 11vw, 42px);
    border-radius:50%;
    border:1px solid #ffffff33;
    background:#ffffff11;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .side-btn:active{ background:#ffffff22; }
  .side-btn:disabled{ opacity:0.25; cursor:default; }
  .side-btn:disabled:active{ background:#ffffff11; }

  .stage{
    flex:0 1 auto;
    width:min(76vw, 380px, calc(100vw - 86px));
    min-width:0;
    aspect-ratio: 3 / 4;
    perspective:1400px;
    touch-action: none;
  }
  .card{
    position:relative;
    width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform 0.55s cubic-bezier(.2,.8,.2,1), opacity 0.4s ease;
    cursor:pointer;
    will-change:transform;
  }
  .card.flipped{ transform:rotateY(180deg); }
  .card.dragging{ transition:none; }
  .card.gone{ transition:transform 0.4s ease, opacity 0.4s ease; opacity:0; }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:clamp(16px, 5vw, 24px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:clamp(24px, 8vw, 44px) clamp(20px, 7vw, 38px);
    text-align:center;
    box-shadow:0 20px 50px -12px rgba(0,0,0,0.5);
  }
  .face-front{ background:var(--paper); color:var(--ink); }
  .face-back{ background:var(--back); color:var(--amber); transform:rotateY(180deg); }
  .kicker{ font-size:12px; font-weight:600; letter-spacing:0.06em; margin-bottom:16px; }
  .face-front .kicker{ color:var(--ink-soft); }
  .face-back .kicker{ color:var(--amber-soft); }
  .qa-text{ font-size:clamp(17px, 5.2vw, 23px); font-weight:700; line-height:1.45; overflow-wrap:anywhere; }
  .face-back .qa-text{ font-weight:600; }

  .stamp{
    position:absolute; top:22px;
    padding:7px 14px; border-radius:10px; border:3px solid;
    font-weight:800; font-size:14px; letter-spacing:0.03em;
    opacity:0; transform:rotate(-12deg); pointer-events:none;
  }
  .stamp-know{ left:18px; color:var(--know); border-color:var(--know); }
  .stamp-review{ right:18px; color:var(--review); border-color:var(--review); transform:rotate(12deg); }

  .hint{
    width:min(100%, 380px);
    margin-top:clamp(12px, 2.5vh, 20px); font-size:12px; color:#ffffffaa;
    text-align:center; line-height:1.6; transition:opacity 1s ease;
  }
  .hint.hidden{ opacity:0; }

  /* 하단 알고있음 / 복습 */
  .nav{ display:grid; grid-template-columns:1fr 1fr; width:min(100%, 380px); gap:10px; margin-top:clamp(14px, 2.5vh, 22px); }
  .nav button{
    min-height:48px; padding:12px 16px; border-radius:14px;
    border:1px solid #ffffff33; background:#ffffff11;
    color:#fff; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .nav button:active{ background:#ffffff22; }
  .nav .btn-know{ color:var(--know); border-color:#9cb38055; }
  .nav .btn-review{ color:var(--review); border-color:#e36b6b55; }

  .reset-btn{
    margin-top:12px;
    background:none; border:none;
    color:#ffffff66; font-size:12px; font-weight:500;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .reset-btn:active{ color:#ffffff99; }

  .done-screen{
    display:none; flex-direction:column; align-items:center; text-align:center; color:#fff;
  }
  .done-screen.show{ display:flex; }
  .done-screen h2{ font-size:24px; margin-bottom:10px; }
  .done-screen p{ color:#ffffff99; font-size:14px; margin-bottom:24px; }
  .restart-btn{
    padding:12px 28px; border-radius:14px; border:none;
    background:var(--amber); color:#2a1b42; font-weight:700; font-size:14px; cursor:pointer;
  }

  .generator{
    position:fixed; inset:0; z-index:10; display:flex; align-items:flex-end;
    background:#120b1acc; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .generator.show{ opacity:1; pointer-events:auto; }
  .generator-sheet{
    width:100%; max-width:480px; margin:0 auto; padding:22px 18px calc(20px + env(safe-area-inset-bottom));
    border:1px solid var(--line); border-bottom:0; border-radius:24px 24px 0 0;
    background:#302044; box-shadow:0 -20px 60px #120b1a88;
    transform:translateY(24px); transition:transform .25s ease;
  }
  .generator.show .generator-sheet{ transform:translateY(0); }
  .generator-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .generator-title{ margin:0; color:#fff; font-size:20px; line-height:1.2; }
  .generator-copy{ margin:7px 0 18px; color:#ffffff99; font-size:12px; line-height:1.5; }
  .generator-close{ border:0; background:#ffffff10; color:#fff; width:32px; height:32px; border-radius:50%; font-size:20px; cursor:pointer; }
  .generator textarea{
    display:block; width:100%; min-height:112px; resize:vertical; border:1px solid #ffffff24; border-radius:14px;
    padding:13px; background:#1f1530; color:#fff; font:inherit; font-size:14px; line-height:1.5; outline:none;
  }
  .generator textarea:focus{ border-color:#f2b84b99; box-shadow:0 0 0 3px #f2b84b18; }
  .generator textarea::placeholder{ color:#ffffff55; }
  .generator-examples{ display:flex; gap:7px; overflow-x:auto; margin:10px 0 14px; padding-bottom:2px; }
  .example-chip{ flex:0 0 auto; border:1px solid #ffffff1c; border-radius:999px; background:#ffffff0b; color:#ffffffaa; padding:7px 10px; font:inherit; font-size:11px; cursor:pointer; }
  .generate-submit{ width:100%; min-height:48px; border:0; border-radius:14px; background:var(--amber); color:#2a1b42; font:inherit; font-weight:800; cursor:pointer; }
  .generate-submit:disabled{ opacity:.6; cursor:wait; }
  .generator-status{ min-height:18px; margin:10px 2px 0; color:#ffffff88; font-size:11px; text-align:center; }

  @media (max-height: 680px){
    .session-bar{ margin-top:18px; }
    .stage-row{ margin-top:12px; }
    .hint{ margin-top:9px; }
    .nav{ margin-top:10px; }
    .reset-btn{ margin-top:7px; }
  }
  @media (max-width: 340px){
    .screen{ padding-left:12px; padding-right:12px; }
    .brand{ font-size:14px; }
    .brand-subtitle{ max-width:145px; }
    .stage-row{ gap:4px; }
    .side-btn{ font-size:16px; }
    .nav button{ font-size:12px; padding-left:8px; padding-right:8px; }
    .generate-open{ padding-left:8px; padding-right:8px; }
  }
  @media (orientation: landscape) and (max-height: 600px){
    .session-bar{ margin-top:10px; }
    .stage-row{ margin-top:8px; }
    .stage{ width:min(60vw, 300px, calc((100dvh - 172px) * .75)); }
    .hint{ margin-top:8px; }
    .nav{ margin-top:8px; }
    .reset-btn{ margin-top:5px; }
    .footer{ display:none; }
  }
</style>
</head>
<body>

  <div class="screen">
    <div class="header">
      <div class="brand-wrap">
        <div class="brand">Flip</div>
        <div class="brand-subtitle">5 minutes to take control of your life</div>
      </div>
      <div class="header-actions">
        <div class="progress-wrap">
          <div class="progress" id="progress">1 / 14</div>
          <div class="progress-label">progress</div>
        </div>
        <button class="menu-toggle" id="menuToggle" aria-label="전체 메뉴 열기" aria-expanded="false">☰</button>
      </div>
      <div class="review-count" id="reviewCount"></div>
    </div>

    <div class="session-bar">
      <span class="session-label">오늘의 집중 세션</span>
      <span class="session-time">5 min</span>
    </div>

    <div class="stage-row">
      <button class="side-btn" id="prevBtn" disabled aria-label="이전 카드">‹</button>

      <div class="stage" id="stage">
        <div class="card" id="card">
          <div class="stamp stamp-know" id="stampKnow">알고있음 ✓</div>
          <div class="stamp stamp-review" id="stampReview">복습 ↻</div>
          <div class="face face-front">
            <div class="kicker">Q</div>
            <div class="qa-text" id="qText"></div>
          </div>
          <div class="face face-back">
            <div class="kicker">A</div>
            <div class="qa-text" id="aText"></div>
          </div>
        </div>
      </div>

      <button class="side-btn" id="nextBtn" aria-label="다음 카드">›</button>
    </div>

    <div class="done-screen" id="doneScreen">
      <h2>오늘의 복습 완료!</h2>
      <p>14장 모두 "알고있음"으로 넘겼어요.</p>
      <button class="restart-btn" id="restartBtn">다시 처음부터</button>
    </div>

    <div class="hint" id="hint">탭해서 답 보기 · 스와이프 ← 알고있음 · → 복습 · ↓ 다음</div>

    <div class="nav" id="navButtons">
      <button class="btn-know" id="knowBtn">알고있음</button>
      <button class="btn-review" id="reviewBtn">복습</button>
    </div>

    <button class="reset-btn" id="resetBtn">초기화</button>

    <div class="footer">2026. ReclaimLab Inc.</div>
  </div>

  <div class="menu-layer" id="menuLayer" aria-hidden="true">
    <nav class="app-menu" aria-label="전체 메뉴">
      <div class="menu-heading">Flip menu</div>
      <button class="menu-item" data-menu-action="login">로그인 <span>계정 연결</span></button>
      <button class="menu-item" data-menu-action="create-stack">새 스택 만들기 <span>준비 중</span></button>
      <button class="menu-item" data-menu-action="view-stacks">전체 스택 보기 <span>준비 중</span></button>
      <button class="menu-item menu-item-primary" data-menu-action="generate">AI 카드 만들기 <span>새 카드</span></button>
      <button class="menu-item" data-menu-action="settings">설정 <span>준비 중</span></button>
      <div class="menu-notice" id="menuNotice" role="status"></div>
    </nav>
  </div>

  <div class="generator" id="generator" aria-hidden="true">
    <section class="generator-sheet" role="dialog" aria-modal="true" aria-labelledby="generatorTitle">
      <div class="generator-head">
        <div>
          <h2 class="generator-title" id="generatorTitle">AI 카드 만들기</h2>
          <p class="generator-copy">주제나 노트를 넣으면 바로 복습할 수 있는 카드 초안을 만들어요.</p>
        </div>
        <button class="generator-close" id="generatorCloseBtn" aria-label="카드 만들기 닫기">×</button>
      </div>
      <textarea id="generatorInput" placeholder="예: 프롬프트 엔지니어링의 핵심을 복습하고 싶어"></textarea>
      <div class="generator-examples" aria-label="추천 주제">
        <button class="example-chip" data-prompt="회의를 더 잘하는 방법">회의 운영</button>
        <button class="example-chip" data-prompt="자바스크립트 비동기 처리">JavaScript</button>
        <button class="example-chip" data-prompt="나의 이번 주 독서 노트">독서 노트</button>
      </div>
      <button class="generate-submit" id="generateSubmit">카드 5장 생성하기</button>
      <div class="generator-status" id="generatorStatus" role="status"></div>
    </section>
  </div>

<script>
  // 카드 데이터 (하드코딩 DB)
  let cardData = [
    { q: "AI 시대에 경쟁력은 무엇으로 이동했는가?", a: '"얼마나 아는가"에서 "무엇을 해결하는가"로' },
    { q: "LLM(대규모 언어모델)이란 무엇인가?", a: "언어를 입력과 출력의 인터페이스로 쓰는 대규모 생성 모델" },
    { q: "LLM은 어떻게 답을 만드는가?", a: "맥락을 바탕으로 다음에 올 확률 높은 토큰을 반복 예측해서 생성" },
    { q: "AI 시대의 학습 루프는?", a: "Do → Fail → Ask → Learn (실행 → 실패 → 질문 → 학습)" },
    { q: "좋은 프롬프트의 5요소는?", a: "Context, Goal, Constraint, Output, Criteria" },
    { q: "AI에게 맡길 수 없는 것 3가지는?", a: "목적 결정, 가치 판단, 최종 책임·검증" },
    { q: "바이브 코딩이란?", a: "AI에게 원하는 걸 설명하고 대화하며 만들어가는 방식" },
    { q: "바이브 코딩에서 가장 어려운 것은?", a: "코드 작성이 아니라 '무엇을 만들지 정확히 아는 것'" },
    { q: "5 Whys 기법이란?", a: "'왜?'를 5번 반복해서 물어 진짜 문제를 찾는 방법" },
    { q: "코닥 실패의 핵심 키워드는?", a: "자기잠식 — 기술은 있었지만 필름 매출 보호로 묵혀둠" },
    { q: "넷플릭스 성공의 핵심 키워드는?", a: "Self-disruption — 잘되는 사업을 스스로 축소하고 전환" },
    { q: "옵시디언 DB화의 3대 요소는?", a: "폴더(어디에), Properties(무엇인지), 링크(무엇과 연결)" },
    { q: "옵시디언 파일명 규칙은?", a: "실제 부르는 이름 그대로. 날짜·상태는 제목 아닌 Properties에" },
    { q: "Bases란?", a: "노트의 Properties를 모아 표·카드 형태 DB 화면으로 보여주는 기능" }
  ];

  // queue: 남은 카드들의 인덱스. 앞에서 하나씩 꺼내 보여준다.
  //  - 알고있음: 완전히 제거 (다시 안 돌아옴)
  //  - 복습/다음: 맨 뒤로 다시 넣음 (한 바퀴 돌고 재등장)
  let queue = cardData.map((_, i) => i);
  let totalCount = cardData.length;
  let flipped = false;
  let reviewMarked = new Set();   // '복습'으로 표시된 카드 (이전 이동 시 제외 대상)
  let skipHistory = [];           // '다음'으로 넘긴 카드만 기록 (이전 이동의 대상)
  let hintShown = true;

  const cardEl = document.getElementById('card');
  const stageEl = document.getElementById('stage');
  const qText = document.getElementById('qText');
  const aText = document.getElementById('aText');
  const progressEl = document.getElementById('progress');
  const reviewCountEl = document.getElementById('reviewCount');
  const hintEl = document.getElementById('hint');
  const doneScreen = document.getElementById('doneScreen');
  const navButtons = document.getElementById('navButtons');
  const stampKnow = document.getElementById('stampKnow');
  const stampReview = document.getElementById('stampReview');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const generator = document.getElementById('generator');
  const generatorInput = document.getElementById('generatorInput');
  const generatorStatus = document.getElementById('generatorStatus');
  const generateSubmit = document.getElementById('generateSubmit');
  const menuLayer = document.getElementById('menuLayer');
  const menuToggle = document.getElementById('menuToggle');
  const menuNotice = document.getElementById('menuNotice');

  function currentCard(){
    return cardData[queue[0]];
  }

  function updatePrevButtonState(){
    const hasValidHistory = skipHistory.some(i => !reviewMarked.has(i) && queue.includes(i));
    prevBtn.disabled = !hasValidHistory;
  }

  function render(){
    if(queue.length === 0){
      document.querySelector('.stage-row').style.display = 'none';
      navButtons.style.display = 'none';
      hintEl.style.display = 'none';
      doneScreen.classList.add('show');
      return;
    }
    const c = currentCard();
    qText.textContent = c.q;
    aText.textContent = c.a;
    progressEl.textContent = (totalCount - queue.length + 1) + ' / ' + totalCount;
    reviewCountEl.textContent = reviewMarked.size > 0 ? ('복습 표시 ' + reviewMarked.size + '장') : '';
    cardEl.classList.remove('flipped');
    cardEl.style.transform = '';
    cardEl.style.opacity = '';
    flipped = false;
    updatePrevButtonState();
  }

  function dismissHint(){
    if(hintShown){
      hintShown = false;
      hintEl.classList.add('hidden');
    }
  }

  function toggleFlip(){
    flipped = !flipped;
    cardEl.classList.toggle('flipped', flipped);
    dismissHint();
  }

  // action: 'know' | 'review' | 'skip'
  function resolveCard(action){
    dismissHint();
    const idx = queue.shift();

    if(action === 'know'){
      // 완전히 제거
    } else if(action === 'review'){
      reviewMarked.add(idx);
      queue.push(idx);
    } else {
      queue.push(idx);
      skipHistory.push(idx); // '이전' 이동의 대상은 스킵된 카드만
    }

    cardEl.classList.add('gone');
    let exitX = action === 'know' ? -500 : (action === 'review' ? 500 : 0);
    let exitY = action === 'skip' ? 400 : 0;
    cardEl.style.transform = `translate(${exitX}px, ${exitY}px) rotate(${exitX/20}deg)`;

    setTimeout(() => {
      cardEl.classList.remove('gone', 'dragging');
      stampKnow.style.opacity = 0;
      stampReview.style.opacity = 0;
      render();
    }, 260);
  }

  function goPrevious(){
    dismissHint();
    while(skipHistory.length){
      const idx = skipHistory.pop();
      if(reviewMarked.has(idx)) continue;      // 복습으로 표시된 카드는 제외
      const pos = queue.indexOf(idx);
      if(pos === -1) continue;                 // 이미 큐에서 사라진 카드(알고있음)는 제외

      queue.splice(pos, 1);
      queue.unshift(idx);

      cardEl.style.transition = 'none';
      cardEl.style.transform = 'translateX(-50px)';
      cardEl.style.opacity = '0';
      render();
      requestAnimationFrame(() => {
        cardEl.style.transition = 'transform 0.35s ease, opacity 0.35s ease';
        cardEl.style.transform = '';
        cardEl.style.opacity = '1';
      });
      return;
    }
    updatePrevButtonState();
  }

  function createGeneratedCards(topic){
    const subject = topic.replace(/[.!?]+$/, '').trim();
    const prompts = [
      [`${subject}의 핵심 개념은 무엇인가?`, `${subject}을 한 문장으로 정의하고, 해결하려는 문제를 설명한다.`],
      [`${subject}가 중요한 이유는 무엇인가?`, `${subject}가 실제 상황에서 어떤 가치와 변화를 만드는지 설명한다.`],
      [`${subject}를 이해할 때 헷갈리기 쉬운 점은?`, `비슷해 보이는 개념과의 차이 또는 자주 하는 오해를 짚어본다.`],
      [`${subject}를 직접 적용한다면 어떻게 시작할까?`, `작게 시도할 수 있는 첫 행동을 정하고, 결과를 관찰한다.`],
      [`${subject}를 설명할 때 기억할 한 문장은?`, `${subject}의 목적, 원리, 적용 방법을 짧고 분명하게 요약한다.`]
    ];
    return prompts.map(([q, a]) => ({ q, a }));
  }

  function openGenerator(){
    closeMenu();
    generator.classList.add('show');
    generator.setAttribute('aria-hidden', 'false');
    generatorStatus.textContent = '';
    setTimeout(() => generatorInput.focus(), 120);
  }

  function closeGenerator(){
    generator.classList.remove('show');
    generator.setAttribute('aria-hidden', 'true');
  }

  function openMenu(){
    menuLayer.classList.add('show');
    menuLayer.setAttribute('aria-hidden', 'false');
    menuToggle.setAttribute('aria-expanded', 'true');
    menuNotice.textContent = '';
  }

  function closeMenu(){
    menuLayer.classList.remove('show');
    menuLayer.setAttribute('aria-hidden', 'true');
    menuToggle.setAttribute('aria-expanded', 'false');
  }

  function generateCards(){
    const topic = generatorInput.value.trim();
    if(!topic){
      generatorStatus.textContent = '주제나 노트를 먼저 입력해 주세요.';
      generatorInput.focus();
      return;
    }

    generateSubmit.disabled = true;
    generatorStatus.textContent = '카드 초안을 만들고 있어요...';

    setTimeout(() => {
      const generatedCards = createGeneratedCards(topic);
      const firstNewIndex = cardData.length;
      cardData.push(...generatedCards);
      totalCount = cardData.length;

      if(queue.length === 0){
        queue = generatedCards.map((_, i) => firstNewIndex + i);
        document.querySelector('.stage-row').style.display = '';
        navButtons.style.display = '';
        hintEl.style.display = '';
        doneScreen.classList.remove('show');
      } else {
        queue.push(...generatedCards.map((_, i) => firstNewIndex + i));
      }

      generatorInput.value = '';
      generatorStatus.textContent = '카드 5장이 복습 목록에 추가됐어요.';
      generateSubmit.disabled = false;
      render();
      setTimeout(closeGenerator, 700);
    }, 450);
  }

  cardEl.addEventListener('click', () => {
    if(dragMoved) return;
    toggleFlip();
  });

  document.getElementById('knowBtn').addEventListener('click', () => resolveCard('know'));
  document.getElementById('reviewBtn').addEventListener('click', () => resolveCard('review'));
  nextBtn.addEventListener('click', () => resolveCard('skip'));
  prevBtn.addEventListener('click', () => { if(!prevBtn.disabled) goPrevious(); });

  function resetDeck(){
    queue = cardData.map((_, i) => i);
    reviewMarked = new Set();
    skipHistory = [];
    document.querySelector('.stage-row').style.display = '';
    navButtons.style.display = '';
    hintEl.style.display = '';
    doneScreen.classList.remove('show');
    render();
  }

  document.getElementById('restartBtn').addEventListener('click', resetDeck);
  document.getElementById('resetBtn').addEventListener('click', resetDeck);
  menuToggle.addEventListener('click', () => {
    if(menuLayer.classList.contains('show')) closeMenu();
    else openMenu();
  });
  menuLayer.addEventListener('click', (event) => {
    if(event.target === menuLayer){
      closeMenu();
      return;
    }
    const item = event.target.closest('[data-menu-action]');
    if(!item) return;
    if(item.dataset.menuAction === 'generate'){
      openGenerator();
      return;
    }
    const messages = {
      login: '로그인 기능은 다음 단계에서 연결할 예정이에요.',
      'create-stack': '새 스택 만들기를 준비하고 있어요.',
      'view-stacks': '클라우드 스택 보기는 로그인 후 열려요.',
      settings: '설정 메뉴를 준비하고 있어요.'
    };
    menuNotice.textContent = messages[item.dataset.menuAction];
  });
  document.getElementById('generatorCloseBtn').addEventListener('click', closeGenerator);
  document.getElementById('generateSubmit').addEventListener('click', generateCards);
  generator.addEventListener('click', (event) => {
    if(event.target === generator) closeGenerator();
  });
  document.querySelectorAll('.example-chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      generatorInput.value = chip.dataset.prompt;
      generatorInput.focus();
    });
  });
  document.addEventListener('keydown', (event) => {
    if(event.key === 'Escape' && generator.classList.contains('show')) closeGenerator();
    if(event.key === 'Escape' && menuLayer.classList.contains('show')) closeMenu();
  });

  // --- 스와이프 처리 ---
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, dragMoved = false;

  function onStart(x, y){
    dragging = true;
    dragMoved = false;
    startX = x; startY = y;
    dx = 0; dy = 0;
    cardEl.classList.add('dragging');
  }

  function onMove(x, y){
    if(!dragging) return;
    dx = x - startX;
    dy = y - startY;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) dragMoved = true;

    const rot = dx / 20;
    cardEl.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg) ${flipped ? 'rotateY(180deg)' : ''}`;

    if(Math.abs(dx) > Math.abs(dy)){
      stampKnow.style.opacity = dx < 0 ? Math.min(Math.abs(dx)/100, 1) : 0;
      stampReview.style.opacity = dx > 0 ? Math.min(dx/100, 1) : 0;
    } else {
      stampKnow.style.opacity = 0;
      stampReview.style.opacity = 0;
    }
  }

  function onEnd(){
    if(!dragging) return;
    dragging = false;
    cardEl.classList.remove('dragging');

    const horizontal = Math.abs(dx) > Math.abs(dy);

    if(horizontal && dx < -80){
      resolveCard('know');
    } else if(horizontal && dx > 80){
      resolveCard('review');
    } else if(!horizontal && dy > 80){
      resolveCard('skip');
    } else {
      cardEl.style.transform = '';
      stampKnow.style.opacity = 0;
      stampReview.style.opacity = 0;
    }
    setTimeout(() => { dragMoved = false; }, 50);
  }

  stageEl.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  stageEl.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  stageEl.addEventListener('touchend', onEnd);

  stageEl.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => { if(dragging) onMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', onEnd);

  render();
</script>

</body>
</html>
