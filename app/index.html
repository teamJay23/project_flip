<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flip</title>
<link rel="stylesheet" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- A. 입력 화면 (기능 1, 2, 3) -->
  <section class="screen" id="screen-input">
    <header class="brand">Flip</header>
    <form class="input-form" id="inputForm" novalidate>
      <label class="input-label" for="sourceText">학습하고 싶은 텍스트를 붙여넣으세요</label>
      <textarea id="sourceText" class="source-text"
        placeholder="여기를 길게 눌러 붙여넣기"
        autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      <p class="hint" id="emptyHint" role="alert" hidden>학습할 텍스트를 먼저 붙여넣어 주세요.</p>
      <button type="submit" class="btn-primary" id="submitBtn">카드 만들기</button>
    </form>
  </section>

  <!-- B. 로딩 화면 (기능 6) -->
  <section class="screen" id="screen-loading" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p class="loading-text">카드를 만들고 있어요</p>
  </section>

<script src="app.js"></script>
</body>
</html>
